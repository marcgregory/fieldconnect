# FieldConnect Render Blueprint
# Deploy: Connect GitHub repo → Render auto-provisions all services
# Docs: docs/DEPLOYMENT.md

databases:
  - name: fieldconnect-db
    databaseName: fieldconnect
    region: oregon
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: [] # private network only

services:
  # ─── Fastify API ──────────────────────────────────────────────────────────
  - type: web
    name: fieldconnect-api
    env: node
    region: oregon
    plan: starter
    nodeVersion: 20
    buildCommand: >
      pnpm install --frozen-lockfile &&
      pnpm --filter @fieldconnect/shared build &&
      pnpm --filter @fieldconnect/api build
    startCommand: node apps/api/dist/index.js
    preDeployCommand: >
      npx --yes node-pg-migrate up
      --migration-file-language sql
      --migrations-dir apps/api/src/db/migrations
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldconnect-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false # ⚠️ Generate manually: openssl rand -base64 32
      - key: NEXTAUTH_URL
        sync: false # ⚠️ Set to web service URL after deploy
      - key: CORS_ORIGIN
        sync: false # ⚠️ Same as NEXTAUTH_URL (web service URL)
      - key: PORT
        value: 3001
      - key: HOST
        value: 0.0.0.0
      - key: UPLOAD_DIR
        value: /var/data/uploads

  # ─── Next.js Web ──────────────────────────────────────────────────────────
  - type: web
    name: fieldconnect-web
    env: node
    region: oregon
    plan: starter
    nodeVersion: 20
    buildCommand: >
      pnpm install --frozen-lockfile &&
      pnpm --filter @fieldconnect/shared build &&
      pnpm --filter @fieldconnect/ui build &&
      pnpm --filter @fieldconnect/web build
    startCommand: cd apps/web && npx next start -p $PORT
    autoDeploy: true
    envVars:
      - key: NEXTAUTH_SECRET
        sync: false # ⚠️ Must match API service NEXTAUTH_SECRET
      - key: NEXTAUTH_URL
        sync: false # ⚠️ Set to this service's URL (e.g. https://fieldconnect-web.onrender.com)
      - key: API_URL
        sync: false # ⚠️ Set to API INTERNAL URL for server-side BFF proxy (e.g. http://fieldconnect-api:3001)
      - key: NEXT_PUBLIC_API_URL
        sync: false # ⚠️ Set to API PUBLIC URL for browser WebSocket/fetch (e.g. https://fieldconnect-api.onrender.com)
      - key: PORT
        value: 3002
