# FieldConnect Render Blueprint
# Deploy: Connect GitHub repo → Render auto-provisions all services
# Docs: docs/DEPLOYMENT.md

databases:
  - name: fieldconnect-db
    databaseName: fieldconnect
    region: oregon
    plan: starter
    postgresMajorVersion: 16
    ipAllowList: [] # private network only

services:
  # ─── Fastify API ──────────────────────────────────────────────────────────
  - type: web
    name: fieldconnect-api
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @fieldconnect/shared build
      pnpm --filter @fieldconnect/api build
    startCommand: node apps/api/dist/migrate.js && node apps/api/dist/index.js
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fieldconnect-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: PORT
        value: "3001"
      - key: HOST
        value: "0.0.0.0"
      - key: UPLOAD_DIR
        value: "/var/data/uploads"

  # ─── Next.js Web ──────────────────────────────────────────────────────────
  - type: web
    name: fieldconnect-web
    env: node
    region: oregon
    plan: starter
    buildCommand: |
      pnpm install --frozen-lockfile
      pnpm --filter @fieldconnect/shared build
      pnpm --filter @fieldconnect/ui build
      pnpm --filter @fieldconnect/web build
    startCommand: cd apps/web && npx next start -p $PORT
    autoDeploy: true
    envVars:
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: PORT
        value: "3002"
